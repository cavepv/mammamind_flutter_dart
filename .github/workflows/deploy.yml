name: Deploy Flutter web (mammamind tech demo)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  deploy-web:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # ponytail: base-href assumes GitHub Pages is served from the
      # gh-pages branch at repo-root for a project page named
      # "mammamind_flutter_dart". Adjust if Pages is configured differently.
      - run: flutter build web --base-href /mammamind_flutter_dart/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages

  # ponytail: showcase-only artifacts, not published to any store - unsigned
  # release APK and an unsigned iOS .app, just to prove the app builds and
  # runs on both platforms for job-application demo purposes.
  build-android:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: mammamind-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: mammamind-ios-unsigned
          path: build/ios/iphoneos/Runner.app.zip
